[package]
name = "tankwar-viewer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tankwar human spectator: match directory, live battlefield and replay"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "jpeg",
    "png",
    "wav",
    "ktx2",
    "zstd",
    "tonemapping_luts",
    "webgl2",
] }

tankwar-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
