<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tankwar spectator</title>
<style>
  html, body { margin: 0; height: 100%; background: #20221f; overflow: hidden; }
  canvas#bevy { width: 100%; height: 100%; display: block; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             color: #d8cfb8; font: 16px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">Loading the village...</div>
<canvas id="bevy" tabindex="0"></canvas>
<script type="module">
  import init from "./tankwar-viewer.js";
  init().catch((e) => {
    // Bevy uses an exception for control flow on wasm; ignore that one.
    if (!String(e).includes("Using exceptions for control flow")) console.error(e);
  });
  const hide = () => { const l = document.getElementById("loading"); if (l) l.remove(); };
  new MutationObserver(hide).observe(document.getElementById("bevy"), { attributes: true });
</script>
</body>
</html>
